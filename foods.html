<!DOCTYPE html>
<html>
<head>
    <title>Explore Foods</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .food-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .food-card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .food-card:hover {
            transform: scale(1.05);
        }

        .food-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .food-card h3 {
            margin: 10px 0;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .rating {
            color: orange;
            font-size: 18px;
        }

        .order-btn {
            margin-top: 10px;
            padding: 8px 15px;
            background-color: orange;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .order-btn:hover {
            background-color: darkorange;
        }
    </style>
</head>

    const excitementText = [
        "A perfect treat for your taste buds!",
        "A dish filled with rich flavors!",
        "A delightful meal to brighten your day!",
        "Taste that brings pure happiness!",
        "Freshly prepared and full of love!"
    ];

    let output = "";

    foods.forEach((food, index) => {
        let price = 120 + index * 5;
        let excitement = excitementText[index % excitementText.length];
        let ratingStars = "⭐".repeat(3 + (index % 3)); // 3 to 5 stars

        output += `
            <div class="food-card">
                <img src="${food.img}" alt="${food.name}">
                <h3>${food.name}</h3>
                <p class="price">₹${price}</p>
                <p>${excitement}</p>
                <p class="rating">${ratingStars}</p>
                <button class="order-btn" onclick="placeOrder('${food.name}')">Order</button>
            </div>
        `;
    });

    document.getElementById("foodCards").innerHTML = output;

    function placeOrder(foodName) {
        alert("Your order for " + foodName + " is placed!");
    }
</script>
